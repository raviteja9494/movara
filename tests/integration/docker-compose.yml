services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: movara_test
      POSTGRES_PASSWORD: movara_test
      POSTGRES_DB: movara_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movara_test -d movara_test"]
      interval: 1s
      timeout: 5s
      retries: 30
