name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Backend, database, and web verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Prisma validates the datasource URL without connecting here. The
      # integration suite replaces this with its disposable Postgres URL.
      DATABASE_URL: postgresql://movara_ci:movara_ci@127.0.0.1:5432/movara_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix webui ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint backend and webui
        run: npm run lint

      - name: Build backend
        run: npm run build

      - name: Build webui
        run: npm --prefix webui run build

      - name: Run HTTP integration tests against PostgreSQL
        run: npm run test:integration
