# Backend (Fastify API), PostgreSQL, and Web UI
# Copy .env.release.example to .env and set DB_PASSWORD (and PORT, WEBUI_PORT, DB_PORT if you need different ports).
# Usage: docker compose up -d   (then open http://localhost:8080 for UI, or your WEBUI_PORT)

version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: movara-db
    environment:
      POSTGRES_USER: ${DB_USER:-movara}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-movara}
      POSTGRES_DB: ${DB_NAME:-movara}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-movara}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js + Fastify)
  app:
    build: .
    container_name: movara-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"  # fixed in container (webui proxies to app:3000); host port from mapping below
      DATABASE_URL: postgresql://${DB_USER:-movara}:${DB_PASSWORD:-movara}@db:5432/${DB_NAME:-movara}
      GT06_PORT: ${GT06_PORT:-5023}
      EELINK_PORT: ${EELINK_PORT:-5064}
      EELINK_TLS_ENABLED: ${EELINK_TLS_ENABLED:-true}
      OSMAND_PORT: ${OSMAND_PORT:-5055}
      EELINK_TLS_CERT_PATH: ${EELINK_TLS_CERT_PATH:-}
      EELINK_TLS_KEY_PATH: ${EELINK_TLS_KEY_PATH:-}
      PROTOCOL_DEBUG: ${PROTOCOL_DEBUG:-false}
      PROTOCOL_DEBUG_DIR: ${PROTOCOL_DEBUG_DIR:-/app/protocol-logs}
    ports:
      - "${PORT:-3000}:3000"  # host port for API (set PORT in .env to use a different port)
      - "${GT06_PORT:-5023}:5023"
      - "${EELINK_PORT:-5064}:5064"
      - "${OSMAND_PORT:-5055}:5055"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      - ./protocol-logs:/app/protocol-logs
      - ./certs:/app/certs
    restart: unless-stopped

  # Web UI (React + Vite, served by nginx; proxies /api and /health to app)
  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    container_name: movara-webui
    ports:
      - "${WEBUI_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
